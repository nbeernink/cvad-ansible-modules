---
- name: Prepare test variables
  ansible.builtin.include_role:
    name: prepare_test_vars

- name: Test machine_maintenancemode module
  module_defaults:
    group/nbeernink.cvad.cvad:
      ddc_server: "{{ cvad_connection.ddc_server }}"
      username: "{{ cvad_connection.username }}"
      password: "{{ cvad_connection.password }}"
      validate_certs: "{{ cvad_connection.validate_certs }}"
    nbeernink.cvad.machine_maintenancemode:
      machine_name: "{{ cvad_machine_name }}"
    nbeernink.cvad.machine_info:
      machine_name: "{{ cvad_machine_name }}"
  block:
    - name: Assert test machine name is provided
      ansible.builtin.assert:
        that:
          - cvad_machine_name is defined
          - cvad_machine_name | length > 0
        fail_msg: "CVAD_TEST_MACHINE must be provided to run machine_maintenancemode integration tests"

    # -------------------------------------------------------------
    # 0. Baseline setup: ensure maintenance mode is off
    # -------------------------------------------------------------
    - name: "0. Baseline: Ensure maintenance mode is off"
      nbeernink.cvad.machine_maintenancemode:
        state: off
      register: baseline_cleanup

    # -------------------------------------------------------------
    # 1. Enter maintenance mode
    # -------------------------------------------------------------
    - name: "1.1. Put machine into maintenance mode with reason"
      nbeernink.cvad.machine_maintenancemode:
        state: on
        reason: "{{ cvad_maintenance_reason }}"
      register: enter_maintenance

    - name: "1.1. Assert machine entered maintenance mode"
      ansible.builtin.assert:
        that:
          - enter_maintenance is changed
          - "'entered maintenance mode' in enter_maintenance.machine_status"
        fail_msg: "Failed to enter maintenance mode: {{ enter_maintenance }}"

    - name: "1.2. Verify maintenance state via machine_info"
      nbeernink.cvad.machine_info:
      register: verify_in_maintenance

    - name: "1.2. Assert InMaintenanceMode flag is true"
      ansible.builtin.assert:
        that:
          - verify_in_maintenance.machine_info.InMaintenanceMode == true
        fail_msg: "Machine InMaintenanceMode flag was not true: {{ verify_in_maintenance.machine_info }}"

    - name: "1.3. Idempotency: Put machine into maintenance mode again"
      nbeernink.cvad.machine_maintenancemode:
        state: on
      register: enter_maintenance_idempotent

    - name: "1.3. Assert entering maintenance mode again is idempotent"
      ansible.builtin.assert:
        that:
          - enter_maintenance_idempotent is not changed
          - "'already on' in enter_maintenance_idempotent.machine_status"
        fail_msg: "Entering maintenance mode was not idempotent: {{ enter_maintenance_idempotent }}"

    # -------------------------------------------------------------
    # 2. Check mode (Dry run exiting maintenance mode)
    # -------------------------------------------------------------
    - name: "2.1. Test check mode when exiting maintenance mode"
      nbeernink.cvad.machine_maintenancemode:
        state: off
      check_mode: true
      register: exit_maintenance_check_mode

    - name: "2.1. Assert check mode indicates change"
      ansible.builtin.assert:
        that:
          - exit_maintenance_check_mode is changed
          - "'exited maintenance mode' in exit_maintenance_check_mode.machine_status"
        fail_msg: "Check mode failed to report prospective change: {{ exit_maintenance_check_mode }}"

    - name: "2.2. Verify machine remains in maintenance mode after check mode"
      nbeernink.cvad.machine_info:
      register: verify_still_in_maintenance

    - name: "2.2. Assert InMaintenanceMode flag is still true"
      ansible.builtin.assert:
        that:
          - verify_still_in_maintenance.machine_info.InMaintenanceMode == true
        fail_msg: "Check mode modified live machine state! {{ verify_still_in_maintenance.machine_info }}"

    # -------------------------------------------------------------
    # 3. Exit maintenance mode
    # -------------------------------------------------------------
    - name: "3.1. Take machine out of maintenance mode"
      nbeernink.cvad.machine_maintenancemode:
        state: off
      register: exit_maintenance

    - name: "3.1. Assert machine exited maintenance mode"
      ansible.builtin.assert:
        that:
          - exit_maintenance is changed
          - "'exited maintenance mode' in exit_maintenance.machine_status"
        fail_msg: "Failed to exit maintenance mode: {{ exit_maintenance }}"

    - name: "3.2. Verify maintenance state via machine_info"
      nbeernink.cvad.machine_info:
      register: verify_out_of_maintenance

    - name: "3.2. Assert InMaintenanceMode flag is false"
      ansible.builtin.assert:
        that:
          - verify_out_of_maintenance.machine_info.InMaintenanceMode == false
        fail_msg: "Machine InMaintenanceMode flag was not false: {{ verify_out_of_maintenance.machine_info }}"

    - name: "3.3. Idempotency: Take machine out of maintenance mode again"
      nbeernink.cvad.machine_maintenancemode:
        state: off
      register: exit_maintenance_idempotent

    - name: "3.3. Assert exiting maintenance mode again is idempotent"
      ansible.builtin.assert:
        that:
          - exit_maintenance_idempotent is not changed
          - "'already off' in exit_maintenance_idempotent.machine_status"
        fail_msg: "Exiting maintenance mode was not idempotent: {{ exit_maintenance_idempotent }}"

    # -------------------------------------------------------------
    # 4. Negative test: non-existent machine
    # -------------------------------------------------------------
    - name: "4.1. Attempt maintenance mode on non-existent machine"
      nbeernink.cvad.machine_maintenancemode:
        machine_name: "non-existent-vm-99999.example.com"
        state: on
      register: invalid_machine_maintenance
      ignore_errors: true

    - name: "4.1. Assert non-existent machine returns failure"
      ansible.builtin.assert:
        that:
          - invalid_machine_maintenance is failed
          - "'No item found for search' in invalid_machine_maintenance.msg"
        fail_msg: "Expected failure for non-existent machine but got: {{ invalid_machine_maintenance }}"

  always:
    # -------------------------------------------------------------
    # 5. Teardown: ensure machine is left with maintenance mode off
    # -------------------------------------------------------------
    - name: "5.1. Teardown: Restore maintenance mode to off"
      nbeernink.cvad.machine_maintenancemode:
        state: off
      ignore_errors: true
